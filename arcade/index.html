<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111327"><title>FIRE MATE ARCADE · 수박게임</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#28325e,#101225 65%);color:#f9faff;font-family:system-ui,sans-serif;min-height:100dvh}main{max-width:470px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}a,button{color:white;background:#323b69;border:1px solid #6571aa;border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:700}h1{font-size:23px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:#222a4c;border:1px solid #414d7a;border-radius:14px;padding:9px;text-align:center}.stat small{display:block;color:#bac3e5}.stat strong{font-size:21px}canvas{display:block;width:100%;touch-action:none;border:3px solid #6874ab;border-radius:16px;background:linear-gradient(#191e39,#272342);box-shadow:0 14px 35px #070817aa}.controls{display:flex;gap:8px;justify-content:space-between;margin:12px 0}.hint{font-size:13px;color:#bdc5e7;line-height:1.5}.rank{background:#202847;border-radius:14px;padding:12px;margin-top:14px}.rank h2{font-size:16px;margin:0 0 8px}.rank ol{margin:0;padding-left:24px;font-size:14px;line-height:1.9}.rank li span{float:right;color:#b8c2e6}#notice{font-size:14px;min-height:21px;color:#fcd57a}</style></head><body><main><header><a href="../index.html">← FIRE MATE</a><span>🎮 ARCADE 01</span></header><h1>🍉 수박게임</h1><div class="stats"><div class="stat"><small>점수</small><strong id="score">0</strong></div><div class="stat"><small>최고 기록</small><strong id="best">0</strong></div><div class="stat"><small>다음 과일</small><strong id="next">🍒</strong></div></div><canvas id="game" width="360" height="520" aria-label="수박게임 플레이 영역"></canvas><div class="controls"><button id="restart">↻ 다시 시작</button><button id="rankToggle">🏆 기록 보기</button></div><div id="notice">화면을 터치해서 과일을 떨어뜨려 봐!</div><p class="hint">같은 과일끼리 닿으면 더 큰 과일로 합쳐져요. 과일이 위쪽 위험선에 오래 닿으면 게임 종료! 기록은 이 기기에 저장됩니다.</p><section class="rank" id="ranking"><h2>🏆 최고 점수 TOP 10</h2><ol id="scores"></ol></section></main><script>
(()=>{'use strict';
const W=360,H=520,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),KEY='firemate_arcade_watermelon_scores_v1';
const fruits=[['🍒',13,2],['🍓',17,4],['🍇',22,8],['🍊',28,16],['🍋',34,32],['🍎',41,64],['🍐',49,128],['🍑',58,256],['🍍',69,512],['🍈',80,1024],['🍉',92,2048]];
let balls=[],score=0,aim=180,next=0,over=false,last=0,dropAt=0,uid=0, danger=0, raf=0;
function records(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(x=>Number.isFinite(x.score)).slice(0,10):[]}catch{return []}}
function renderRank(){const list=records();$('best').textContent=list[0]?.score||0;$('scores').replaceChildren();list.forEach(x=>{const li=document.createElement('li');li.textContent=x.score.toLocaleString()+'점';const span=document.createElement('span');span.textContent=x.date||'';li.append(span);$('scores').append(li)});if(!list.length)$('scores').textContent='아직 기록이 없어요. 첫 기록에 도전!'}
function save(){const list=records();list.push({score,date:new Date().toLocaleDateString('ko-KR')});list.sort((a,b)=>b.score-a.score);try{localStorage.setItem(KEY,JSON.stringify(list.slice(0,10)))}catch{}renderRank()}
function update(){ $('score').textContent=score.toLocaleString();$('next').textContent=fruits[next][0]}
function reset(){balls=[];score=0;aim=180;next=Math.floor(Math.random()*4);over=false;danger=0;dropAt=0;$('notice').textContent='화면을 터치해서 과일을 떨어뜨려 봐!';update()}
function drop(){if(over||performance.now()-dropAt<360)return;const r=fruits[next][1];balls.push({id:++uid,x:Math.max(r+2,Math.min(W-r-2,aim)),y:40,r,level:next,vx:0,vy:0,age:0});next=Math.floor(Math.random()*4);dropAt=performance.now();update()}
function merge(a,b){if(a.level!==b.level||a.level>=fruits.length-1)return false;const level=a.level+1,r=fruits[level][1],x=(a.x+b.x)/2,y=(a.y+b.y)/2;balls=balls.filter(o=>o!==a&&o!==b);balls.push({id:++uid,x:Math.max(r,Math.min(W-r,x)),y:Math.max(r,y),r,level,vx:(a.vx+b.vx)/2,vy:-2,age:0});score+=fruits[level][2];update();return true}
function physics(dt){const steps=3;for(let z=0;z<steps;z++){const t=Math.min(dt,2)/steps;for(const b of balls){b.age+=t;b.vy+=0.26*t;b.x+=b.vx*t;b.y+=b.vy*t;b.vx*=0.994;b.vy*=0.997;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*0.35}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*0.35}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*0.22;b.vx*=0.96}}let didMerge=false;for(let i=0;i<balls.length&&!didMerge;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01,min=a.r+b.r;if(d>=min)continue;if(a.level===b.level&&a.age>6&&b.age>6&&merge(a,b)){didMerge=true;break}const nx=dx/d,ny=dy/d,overlap=min-d,wa=b.r*b.r/(a.r*a.r+b.r*b.r),wb=1-wa;a.x-=nx*overlap*wa;a.y-=ny*overlap*wa;b.x+=nx*overlap*wb;b.y+=ny*overlap*wb;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-rel*0.22;a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse}}}}
function draw(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='#fb6d8d';ctx.setLineDash([9,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,80);ctx.lineTo(W,80);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffb7c8';ctx.font='12px system-ui';ctx.fillText('위험선',8,74);for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=['#a72f63','#d64a60','#7354b8','#e99432','#e9cb44','#d74b4b','#9abb60','#e99982','#b5a546','#91bc7a','#4eaf68'][b.level];ctx.fill();ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.stroke();ctx.font=Math.min(b.r*1.55,74)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(fruits[b.level][0],b.x,b.y+2)}if(!over){const r=fruits[next][1];ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(aim,40,r,0,Math.PI*2);ctx.fillStyle='#e9a7c8';ctx.fill();ctx.globalAlpha=1;ctx.font=Math.min(r*1.5,45)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(fruits[next][0],aim,40)}else{ctx.fillStyle='#101225dd';ctx.fillRect(0,185,W,140);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText('GAME OVER',W/2,235);ctx.font='19px system-ui';ctx.fillText(score.toLocaleString()+'점',W/2,274)}}
function frame(t){const dt=last?Math.min((t-last)/16.67,2):1;last=t;if(!over){physics(dt);const dangerNow=balls.some(b=>b.age>75&&b.y-b.r<80);danger=dangerNow?danger+dt:Math.max(0,danger-2*dt);if(danger>125){over=true;save();$('notice').textContent='게임 종료! '+score.toLocaleString()+'점 기록 완료 🏆'}}draw();raf=requestAnimationFrame(frame)}
function point(e){const rect=canvas.getBoundingClientRect();aim=Math.max(15,Math.min(W-15,(e.clientX-rect.left)*W/rect.width))}
canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')point(e)});canvas.addEventListener('pointerdown',e=>{e.preventDefault();point(e);drop()});$('restart').addEventListener('click',()=>{if(!over&&score>0&&!confirm('현재 게임을 다시 시작할까요?'))return;if(!over&&score>0)save();reset()});$('rankToggle').addEventListener('click',()=>{$('ranking').scrollIntoView({behavior:'smooth'})});document.addEventListener('visibilitychange',()=>{last=0});renderRank();reset();raf=requestAnimationFrame(frame);
})();
</script></body></html>
