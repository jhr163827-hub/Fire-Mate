name: Refresh chart history
on:
  workflow_dispatch:
  schedule:
    - cron: '35 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: chart-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance==0.2.66
      - run: python scripts/refresh_charts.py
      - name: Commit chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart-data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh daily public chart history"
          # The live-quotes job commits every 30 minutes; rebase onto it instead of failing the push.
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
