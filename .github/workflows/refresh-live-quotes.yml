name: Refresh live quotes
on:
  workflow_dispatch:
  schedule:
    # Once a day after the US close (21:43 UTC Mon–Fri = 06:43 KST the next morning) — was every 30 minutes before the account review (2026-11).
    - cron: '43 21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: live-quotes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance==0.2.66
      - run: python scripts/refresh_live_quotes.py
      - name: Commit live quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart-data/live-quotes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh live quotes"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
