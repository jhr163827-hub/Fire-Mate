<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211b32"><title>아케이드 · 추억의 레스토랑</title><style>*{box-sizing:border-box}body{margin:0;background:#211b32;color:#fff5eb;font-family:system-ui,sans-serif}main{max-width:550px;margin:auto;padding:15px}a,button{color:inherit;text-decoration:none;background:#574063;border:1px solid #9578a4;border-radius:12px;padding:11px;font-weight:700}button:disabled{opacity:.4}header,.stats,.actions,.bar{display:flex;justify-content:space-between;gap:8px;align-items:center}h1{font-size:25px;margin:20px 0 8px}.stats>div{flex:1;text-align:center;background:#493650;border-radius:13px;padding:10px}.stats small{display:block;color:#e2c3dc}.scene{background:linear-gradient(#b56f7c 0 43%,#e5b39b 43% 100%);border:5px solid #65405e;border-radius:20px;min-height:285px;margin:14px 0;position:relative;overflow:hidden}.sign{margin:12px auto;background:#6e3456;width:max-content;padding:9px 24px;border-radius:9px;box-shadow:0 5px #50263f}.counter{position:absolute;bottom:14px;left:6%;right:6%;height:60px;background:#955f54;border:5px solid #70433f;border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:30px}.guest{position:absolute;bottom:85px;left:8%;right:8%;display:flex;align-items:end;justify-content:space-around;font-size:48px}.bubble{font-size:14px;background:#fffdf3;color:#43283d;border-radius:14px;padding:8px;min-height:45px;max-width:165px}.panel{background:#42334c;border-radius:16px;padding:14px;margin:12px 0}.panel h2{font-size:17px;margin:0 0 12px}.recipes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.recipes button{display:flex;flex-direction:column;gap:4px;align-items:center}.recipes button b{font-size:29px}.recipes button small{font-size:11px;color:#ead7e7}.actions button{flex:1}.bar{margin:8px 0;color:#eacfe6;font-size:13px}.meter{height:10px;border-radius:10px;background:#231c2b;overflow:hidden}.meter>div{height:100%;background:#f6c76c;width:0;transition:width .2s}.note{color:#e8d4e5;font-size:13px;line-height:1.5}.status{min-height:24px;color:#ffe6a0}#serve{background:#a34f72}#upgrade{width:100%}.kitchen{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.stove{min-height:85px;line-height:1.5;background:#72506c}#recipeDialog{background:#42334c;color:white;border:1px solid #9578a4;border-radius:15px;max-width:92vw;width:360px}#recipeDialog::backdrop{background:#0b0612aa}#recipeDialog button{display:block;width:100%;margin:8px 0;text-align:left}</style></head><body><main><header><a href="./index.html">← 게임 아케이드</a><span>🍳 RESTAURANT 02</span></header><h1>🍜 추억의 레스토랑</h1><p class="note">오래 걸리는 요리를 만들어 판매하고 식당을 키워보세요. 앱을 꺼도 조리는 계속돼요!</p><div class="stats"><div><small>매출 코인</small><strong id="coins">0</strong></div><div><small>서빙 완료</small><strong id="served">0</strong></div><div><small>식당 레벨</small><strong id="level">1</strong></div></div><div class="scene"><div class="sign">🍴 나의 레스토랑 🍴</div><div class="guest"><span id="guest">🧑‍🍳</span><span class="bubble" id="order">어서 오세요!</span><span>🧑</span></div><div class="counter" id="plate">🍽️</div></div><div class="panel"><h2>🧾 손님 주문</h2><div id="status" class="status" role="status">손님을 기다리는 중...</div><div class="bar"><span>손님 기다림</span><span id="time">—</span></div><div class="meter"><div id="patience"></div></div></div><div class="panel"><h2>👩‍🍳 요리 만들기</h2><div class="recipes"><button data-dish="0"><b>🍜</b>라면<small>3초 · 15코인</small></button><button data-dish="1"><b>🍛</b>카레<small>5초 · 25코인</small></button><button data-dish="2"><b>🍔</b>버거<small>7초 · 35코인</small></button></div><div class="bar"><span>요리 진행</span><span id="cookTime">준비 완료</span></div><div class="meter"><div id="progress"></div></div><div class="actions"><button id="serve" disabled>🍽️ 서빙하기</button><button id="discard" disabled>↺ 요리 버리기</button></div><div id="kitchen" class="kitchen"></div><dialog id="recipeDialog"></dialog></div><div class="panel"><h2>🏪 식당 꾸미기 · 업그레이드</h2><button id="upgrade">✨ 주방 업그레이드 (100코인)</button><p class="note">레벨이 오르면 요리 시간이 줄어들어요. 코인과 레벨은 자동 저장돼요.</p></div><button id="newGame">기록 초기화</button><p class="note">※ 원작 이미지·음원은 사용하지 않은 독립적인 레스토랑 게임의 첫 버전입니다.</p></main><script>
(()=>{'use strict';
const KEY='firemate_arcade_restaurant_v2',OLD='firemate_arcade_restaurant_v1',$=id=>document.getElementById(id);
const recipes=[{name:'주먹밥',emoji:'🍙',ms:60000,cost:3,sell:12,lv:1},{name:'라면',emoji:'🍜',ms:300000,cost:10,sell:35,lv:1},{name:'카레',emoji:'🍛',ms:1800000,cost:40,sell:110,lv:2},{name:'햄버거',emoji:'🍔',ms:3600000,cost:90,sell:250,lv:3},{name:'스테이크',emoji:'🥩',ms:14400000,cost:250,sell:780,lv:4}];
let data={coins:150,served:0,level:1,stoves:[null,null],decor:0};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Number.isFinite(d.coins)&&Array.isArray(d.stoves))data={...data,...d,stoves:d.stoves.slice(0,4)}}catch{}
if(!localStorage.getItem(KEY)){try{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){data.coins+=Math.max(0,Number(old.coins)||0);data.level=Math.max(1,Number(old.level)||1);data.served=Math.max(0,Number(old.served)||0)}}catch{}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
const fmt=ms=>{const sec=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=sec%60;return (h?h+'시간 ':'')+(m?m+'분 ':'')+(!h||!m?ss+'초':'')};
const notify=msg=>{$('status').textContent=msg};
function paint(){const now=Date.now();$('coins').textContent=Math.floor(data.coins).toLocaleString();$('served').textContent=data.served;$('level').textContent=data.level;
const kitchen=$('kitchen');kitchen.replaceChildren();data.stoves.forEach((job,i)=>{const card=document.createElement('button');card.className='stove';if(!job){card.textContent='🔥 '+(i+1)+'번 조리대 · 비어 있음';card.onclick=()=>showRecipes(i)}else{const r=recipes[job.recipe],remaining=job.ends-now;if(!r){card.textContent='조리대 확인 필요';return}card.textContent=(remaining<=0?'✅ 완성! ':'⏳ '+fmt(remaining)+' · ')+r.emoji+' '+r.name+' ('+(i+1)+'번)';card.onclick=()=>{if(Date.now()<job.ends){notify('아직 조리 중이에요. '+fmt(job.ends-Date.now())+' 남았어요.');return}data.coins+=r.sell;data.served++;data.stoves[i]=null;save();notify(r.name+' 판매 완료! +'+r.sell+'코인');paint()}}kitchen.append(card)});
$('upgrade').textContent='✨ 식당 확장 ('+(data.level*150)+'코인)';$('upgrade').disabled=data.coins<data.level*150||data.level>=5;
$('plate').textContent='🍳';$('order').textContent='요리 완료 후 조리대를 눌러 판매하세요!';$('guest').textContent='👩‍🍳';$('time').textContent='앱을 꺼도 조리 시간 유지';$('patience').style.width='100%';
const ready=data.stoves.filter(x=>x&&x.ends<=now).length;$('progress').style.width=(ready/data.stoves.length*100)+'%';$('cookTime').textContent=ready+'개 완성';$('serve').disabled=true;$('discard').disabled=true;
}
function showRecipes(i){const box=$('recipeDialog');box.replaceChildren();const h=document.createElement('h2');h.textContent=(i+1)+'번 조리대 · 요리 선택';box.append(h);recipes.forEach((r,n)=>{if(data.level<r.lv)return;const btn=document.createElement('button');btn.textContent=r.emoji+' '+r.name+' · '+fmt(r.ms)+' · 재료 '+r.cost+'코인';btn.disabled=data.coins<r.cost;btn.onclick=()=>{if(data.stoves[i])return;data.coins-=r.cost;data.stoves[i]={recipe:n,ends:Date.now()+r.ms};save();box.close();notify(r.name+' 조리 시작! 앱을 종료해도 시간이 흘러요.');paint()};box.append(btn)});const close=document.createElement('button');close.textContent='취소';close.onclick=()=>box.close();box.append(close);box.showModal()}
$('upgrade').onclick=()=>{const cost=data.level*150;if(data.coins<cost||data.level>=5)return;data.coins-=cost;data.level++;if(data.stoves.length<4)data.stoves.push(null);save();notify('식당 확장! 새 레시피와 조리대를 확인하세요.');paint()};
$('newGame').onclick=()=>{if(!confirm('레스토랑의 코인·요리·레벨을 모두 초기화할까요?'))return;data={coins:150,served:0,level:1,stoves:[null,null],decor:0};save();paint()};
document.querySelectorAll('[data-dish]').forEach(el=>el.remove());$('serve').remove();$('discard').remove();
$('upgrade').parentElement.querySelector('.note').textContent='식당을 확장하면 조리대와 요리 종류가 늘어나요. 저장은 자동으로 진행돼요.';
save();paint();setInterval(paint,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)paint()});
})();
</script></body></html>
