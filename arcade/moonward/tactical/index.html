<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10252e" />
    <title>월광 수호단 · 길목 전술전</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <a id="exit" href="../../index.html" aria-label="아케이드로 나가기"
          >‹</a
        >
        <div>
          <small>MOONWARD · TACTICS</small>
          <h1>길목을 지켜라</h1>
        </div>
        <button id="settings" aria-label="설정 및 일시정지">설정</button>
      </header>
      <section id="hud" aria-label="전투 현황">
        <div><small>성문</small><b id="lives">12</b></div>
        <div><small>웨이브</small><b id="wave">0 / 5</b></div>
        <div><small>달빛 조각</small><b id="gold">230</b></div>
        <button id="speed">1×</button><button id="plan">작전 정지</button>
      </section>
      <div id="stage">
        <section id="field" aria-label="전장">
          <canvas
            id="canvas"
            width="920"
            height="600"
            aria-hidden="true"
          ></canvas>
          <div id="pads" aria-label="배치 제단"></div>
          <div id="callout" role="status"></div>
          <div id="battleNote">제단을 고르고 병력을 배치하세요</div>
        </section>
      </div>
      <section id="panel">
        <div id="intel">
          <span id="phase">배치 시간 · 무료 이동</span
          ><strong id="next"></strong>
          <p id="tip"></p>
        </div>
        <button id="start" class="primary">1웨이브 시작</button>
        <div id="shop" aria-label="수호자 직접 구매"></div>
        <div id="detail"></div>
        <p id="notice" role="status">
          처음엔 궁수와 광역을 한 명씩 배치해 보세요.
        </p>
      </section>
      <footer>
        <span id="saveStatus">전술전 전용 저장</span
        ><button id="help">조합 안내</button
        ><a href="../index.html?classic">기존 랜덤 모드</a>
      </footer>
    </main>
    <dialog id="dialog">
      <div id="dialogBody"></div>
      <button id="close">돌아가기</button>
    </dialog>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
