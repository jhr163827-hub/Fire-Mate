<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1013"><title>STUDY MATE</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:dark;--bg:#0e1013;--panel:#181b20;--panel2:#20242b;--line:#2a2f37;--txt:#f2f4f6;--sub:#9ba4af;--acc:#4fe3a9;--acc2:#1f8f69;--red:#ff6b6b}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#f4f5f7;--panel:#fff;--panel2:#eef0f3;--line:#e3e6ea;--txt:#15181d;--sub:#6b7480;--acc:#14a874;--acc2:#0d7a54;--red:#d93c3c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{max-width:520px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:8px}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}header a{color:var(--sub);font-size:13px;text-decoration:none;padding:10px 0 10px 12px}
.hero{padding:22px 20px 18px;border-radius:22px;background:var(--panel)}
.hero small{display:block;color:var(--sub);font-size:13px}
.total{margin:4px 0 14px;font-size:46px;font-weight:800;line-height:1.05}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .4s}
.goalrow{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--sub)}.goalrow b{color:var(--txt)}
h2{margin:24px 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.list{border-radius:18px;background:var(--panel);overflow:hidden}
.sub{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px 10px 18px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.sub:first-child{border-top:0}.sub .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.sub .nm{flex:1;min-width:0}.sub .nm strong{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub .nm small{display:block;font-size:12px;color:var(--sub)}
.sub .t{font-size:15px;font-weight:700;color:var(--sub)}.sub .t.on{color:var(--txt)}
.play{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-size:15px}
.add{display:block;width:100%;min-height:52px;border:0;border-top:1px solid var(--line);background:none;color:var(--sub);font-size:14px;font-weight:600}
.empty{padding:22px 18px;color:var(--sub);font-size:14px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:170px;min-height:52px;border:0;background:none;color:var(--sub);font-size:12px;font-weight:700}nav button b{display:block;font-size:20px;line-height:1.2}nav button[aria-pressed=true]{color:var(--txt)}
section[hidden]{display:none}
/* focus screen */
.focus{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#050607;color:#f2f4f6;text-align:center}
.focus[hidden]{display:none}.focus .fs{font-size:15px;font-weight:700;color:var(--c)}.focus .fs i{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--c);vertical-align:2px}
.focus .big{margin:10px 0 6px;font-size:min(22vw,104px);font-weight:300;line-height:1}.focus .big.paused{opacity:.45}
.focus .today{color:#9ba4af;font-size:14px}
.focus .ctl{display:flex;gap:14px;margin-top:44px}.focus .ctl button{min-width:120px;min-height:56px;padding:0 22px;border-radius:999px;border:1px solid #2f343c;background:#14171b;color:#f2f4f6;font-size:16px;font-weight:700}
.focus .ctl .stop{border-color:transparent;background:var(--acc);color:#04130d}
.focus .fmin{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:44px;height:44px;border:0;border-radius:50%;background:#14171b;color:#9ba4af;font-size:20px}.focus .hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));color:#5d6570;font-size:12px}
/* stats */
.card{padding:18px;border-radius:18px;background:var(--panel)}.card+.card{margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpis div{padding:14px 10px;border-radius:16px;background:var(--panel);text-align:center}.kpis b{display:block;font-size:20px;white-space:nowrap}.kpis span{font-size:12px;color:var(--sub)}
.week{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:6px}.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.week i{display:block;width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--panel2)}.week i.on{background:var(--acc)}.week span{font-size:11px;color:var(--sub)}.week em{font-style:normal;font-size:11px;color:var(--sub);white-space:nowrap}
.grass{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;margin-top:10px}.grass i{aspect-ratio:1;border-radius:3px;background:var(--panel2)}
.grass .l1{background:color-mix(in srgb,var(--acc) 35%,var(--panel2))}.grass .l2{background:color-mix(in srgb,var(--acc) 65%,var(--panel2))}.grass .l3{background:var(--acc)}.grass .f{opacity:.3}
.ttl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:14px;font-weight:700}.ttl small{font-weight:600;color:var(--sub);font-size:12px}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--panel2);margin:10px 0 8px}.split i{height:100%;background:var(--c)}
.legend div{display:flex;align-items:center;gap:8px;min-height:30px;font-size:14px}.legend .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}.legend span{flex:1}.legend b{font-weight:700}
.sess{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line);font-size:14px}.sess:first-of-type{border-top:0}.sess .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}.sess span{flex:1}.sess small{color:var(--sub)}
.sess button{border:0;background:none;color:var(--sub);min-width:40px;min-height:40px;font-size:16px}
/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 18px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row small{display:block;color:var(--sub);font-size:12px}
.step{display:flex;align-items:center;gap:4px}.step button{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel2);font-size:18px}.step b{min-width:62px;text-align:center}
/* sheet */
.sheetbg{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}.sheetbg[hidden]{display:none}
.sheet{width:100%;max-width:520px;padding:20px 18px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--panel)}
.sheet h3{margin:0 0 14px;font-size:18px}.sheet label{display:block;margin:12px 0 6px;font-size:13px;color:var(--sub)}
.sheet input,.sheet select{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-size:16px}
.colors{display:flex;flex-wrap:wrap;gap:10px}.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--c)}.colors button[aria-pressed=true]{border-color:var(--txt)}
.foot{display:flex;gap:8px;margin-top:20px}.foot button{flex:1;min-height:52px;border-radius:16px;border:0;background:var(--panel2);font-weight:700}.foot .pri{background:var(--acc);color:#04130d}.foot .del{flex:none;padding:0 16px;background:none;color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#2b3038;color:#fff;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s}.toast.show{opacity:1}
</style></head><body>
<div class="app">
<section id="tTimer">
 <header><h1>오늘 공부</h1><a href="../">FIRE MATE ›</a></header>
 <div class="hero"><small id="today"></small><div class="total num" id="total">0:00:00</div><div class="bar"><i id="goalBar" style="width:0"></i></div><div class="goalrow"><span id="goalTxt"></span><span id="streak"></span></div></div>
 <h2>과목</h2><div class="list" id="subs"></div>
</section>
<section id="tStats" hidden>
 <header><h1>기록</h1></header>
 <div class="kpis"><div><b class="num" id="kWeek">0분</b><span>이번 주</span></div><div><b class="num" id="kAvg">0분</b><span>7일 평균</span></div><div><b class="num" id="kStreak">0일</b><span>연속</span></div></div>
 <h2>최근 7일</h2><div class="card"><div class="week" id="week"></div></div>
 <h2>이번 주 과목별</h2><div class="card" id="bySub"></div>
 <h2>최근 16주</h2><div class="card"><div class="ttl">공부한 날 <small id="gTxt"></small></div><div class="grass" id="grass"></div></div>
 <h2>오늘 기록</h2><div class="card" id="sessions"></div>
</section>
<section id="tSet" hidden>
 <header><h1>설정</h1></header>
 <div class="list">
  <div class="row"><span>하루 목표</span><div class="step"><button type="button" data-goal="-30" aria-label="목표 줄이기">−</button><b class="num" id="goalV"></b><button type="button" data-goal="30" aria-label="목표 늘리기">＋</button></div></div>
  <div class="row"><span>하루 시작 시각<small>이 시각 전은 전날로 쳐요</small></span><div class="step"><button type="button" data-ds="-1" aria-label="이르게">−</button><b class="num" id="dsV"></b><button type="button" data-ds="1" aria-label="늦게">＋</button></div></div>
 </div>
 <h2>과목</h2><div class="list" id="subsEdit"></div>
 <h2>자격증 연결</h2><div class="list"><div class="row"><span>FIRE MATE의 준비 중인 자격증은 과목으로 들어오고, 공부한 시간이 자격증의 오늘 공부에 더해져요</span></div></div>
</section>
</div>
<nav><button type="button" data-tab="tTimer" aria-pressed="true"><b>⏱</b>타이머</button><button type="button" data-tab="tStats" aria-pressed="false"><b>📊</b>기록</button><button type="button" data-tab="tSet" aria-pressed="false"><b>⚙︎</b>설정</button></nav>
<div class="focus" id="focus" hidden><button type="button" class="fmin" id="fMin" aria-label="화면 내리기 (타이머는 계속)">⌄</button><div class="fs" id="fSub"></div><div class="big num" id="fBig">00:00:00</div><div class="today num" id="fToday"></div><div class="ctl"><button type="button" id="fPause">일시정지</button><button type="button" class="stop" id="fStop">끝내기</button></div><div class="hint">화면이 꺼지지 않게 해 둘게요</div></div>
<div class="sheetbg" id="sheetBg" hidden><form class="sheet" id="sheet"></form></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const KEY='firemate_study_v1',CERTS='firemate_certificates_v1',$=id=>document.getElementById(id);
const COLORS=['#4fe3a9','#5b9cf0','#f0b44b','#ef6f8c','#a68cf0','#4fc3c7','#ff8a4c','#9ba4af'];
const read=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
let S=read(KEY,{});S={subjects:[],log:[],goal:180,dayStart:5,run:null,hide:[],...S};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch{toast('저장하지 못했어요');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayOf=ms=>ymd(new Date(ms-S.dayStart*36e5));
const today=()=>dayOf(Date.now());
const shift=(day,n)=>{const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const hms=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':''):m+'분'};
let tT;const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2200)};
// FIRE MATE certificates that are goals become subjects (once; a deleted one is not brought back).
function syncCerts(){const l=read(CERTS,{})?.list;if(!Array.isArray(l))return;let n=0;
 for(const c of l)if(c&&c.goal&&c.id&&!S.subjects.some(s=>s.cert===c.id)&&!S.hide.includes(c.id)){S.subjects.push({id:uid(),name:c.name,color:freeColor(),cert:c.id});n++}
 if(n)save()}
const freeColor=()=>COLORS.find(c=>!S.subjects.some(s=>s.color===c))||COLORS[S.subjects.length%COLORS.length];
const short=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0'):m+'분'};
const runSec=()=>{const r=S.run;if(!r)return 0;return (r.acc||0)/1e3+(r.at?(Date.now()-r.at)/1e3:0)};
const minsOn=(day,sub)=>S.log.reduce((t,x)=>t+(dayOf(x.start)===day&&(!sub||x.sub===sub)?x.min:0),0);
const secToday=sub=>minsOn(today(),sub)*60+(S.run&&(!sub||S.run.sub===sub)&&dayOf(S.run.start)===today()?runSec():0);
const daysWith=()=>{const m={};S.log.forEach(x=>{const d=dayOf(x.start);m[d]=(m[d]||0)+x.min});return m};
const streak=()=>{const m=daysWith();let n=0,d=today();if(!m[d]&&!S.run)d=shift(d,-1);while(m[d]||(d===today()&&S.run)){n++;d=shift(d,-1)}return n};
function render(){const t=today(),d=new Date(t+'T12:00:00');
 $('today').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일';
 const sec=secToday();$('total').textContent=hms(sec);$('goalBar').style.width=Math.min(100,sec/60/S.goal*100).toFixed(1)+'%';
 $('goalTxt').innerHTML=sec/60>=S.goal?'🎉 목표 '+hm(S.goal)+' 달성':'목표 <b>'+hm(S.goal)+'</b> · '+Math.floor(sec/60/S.goal*100)+'%';
 const st=streak();$('streak').textContent=st?'🔥 '+st+'일 연속':'';
 $('subs').innerHTML=(S.subjects.length?S.subjects.map(s=>{const on=S.run?.sub===s.id,v=secToday(s.id);return '<div class="sub" style="--c:'+s.color+'"><span class="dot"></span><span class="nm"><strong>'+esc(s.name)+'</strong>'+(s.cert?'<small>🎓 자격증과 연결</small>':'')+'</span><span class="t num'+(v?' on':'')+'">'+hms(v)+'</span><button type="button" class="play" data-play="'+s.id+'" aria-label="'+esc(s.name)+' 시작">'+(on?'⏸':'▶')+'</button></div>'}).join(''):'<div class="empty">공부할 과목을 추가해 보세요</div>')+'<button type="button" class="add" data-addsub>＋ 과목 추가</button>';
}
// focus screen
let lock=null,tick=null;
async function wake(on){try{if(on&&'wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}else if(!on&&lock){await lock.release();lock=null}}catch{}}
function showFocus(){const r=S.run,s=r&&S.subjects.find(x=>x.id===r.sub);if(!s){$('focus').hidden=true;wake(false);clearInterval(tick);return}
 $('focus').hidden=false;$('focus').style.setProperty('--c',s.color);$('fSub').innerHTML='<i></i>'+esc(s.name);$('fPause').textContent=r.at?'일시정지':'계속하기';
 const up=()=>{$('fBig').textContent=hms(runSec()).padStart(8,'0');$('fBig').classList.toggle('paused',!S.run?.at);$('fToday').textContent='오늘 '+hms(secToday())};up();clearInterval(tick);tick=setInterval(up,1000);if(r.at)wake(true);else wake(false)}
function start(id){if(S.run)stop();S.run={sub:id,start:Date.now(),at:Date.now(),acc:0};save();render();showFocus()}
function pause(){const r=S.run;if(!r)return;if(r.at){r.acc=(r.acc||0)+Date.now()-r.at;r.at=null}else r.at=Date.now();save();showFocus()}
function stop(){const r=S.run;if(!r)return;const sec=runSec(),min=Math.round(sec/60);S.run=null;
 if(min>=1){S.log.push({id:uid(),sub:r.sub,start:r.start,min});const s=S.subjects.find(x=>x.id===r.sub);if(s?.cert)certAdd(s.cert,dayOf(r.start),min);toast('📚 '+hm(min)+' 기록했어요')}else toast('1분이 안 돼서 기록하지 않았어요');
 save();render();showFocus();renderStats()}
function certAdd(id,day,min){try{const v=read(CERTS,{}),c=v?.list?.find(x=>x.id===id);if(!c)return;c.study={...(c.study||{}),[day]:Math.max(0,((c.study||{})[day]||0)+min)};localStorage.setItem(CERTS,JSON.stringify(v))}catch{}}
$('fPause').onclick=pause;$('fMin').onclick=()=>{$('focus').hidden=true;clearInterval(tick);wake(false)};$('fStop').onclick=stop;
document.addEventListener('visibilitychange',()=>{if(!document.hidden){S={...S,...read(KEY,{})};syncCerts();render();showFocus();renderStats()}});
// stats
function renderStats(){const t=today(),m=daysWith();if(S.run)m[t]=(m[t]||0)+runSec()/60;
 const days=[...Array(7)].map((_,k)=>shift(t,k-6)),mx=Math.max(60,...days.map(d=>m[d]||0));
 $('week').innerHTML=days.map(d=>{const v=m[d]||0,dt=new Date(d+'T12:00:00');return '<div><em class="num">'+(v?short(v):'')+'</em><i class="'+(d===t?'on':'')+'" style="height:'+Math.max(4,Math.round(v/mx*96))+'px"></i><span>'+'일월화수목금토'[dt.getDay()]+'</span></div>'}).join('');
 const mon=shift(t,-((new Date(t+'T12:00:00').getDay()+6)%7)),wk=Object.entries(m).filter(([d])=>d>=mon&&d<=t),wt=wk.reduce((a,[,v])=>a+v,0);
 $('kWeek').textContent=short(wt);$('kAvg').textContent=short(days.reduce((a,d)=>a+(m[d]||0),0)/7);$('kStreak').textContent=streak()+'일';
 const by={};S.log.forEach(x=>{const d=dayOf(x.start);if(d>=mon&&d<=t)by[x.sub]=(by[x.sub]||0)+x.min});if(S.run&&dayOf(S.run.start)>=mon)by[S.run.sub]=(by[S.run.sub]||0)+runSec()/60;
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),sum=rows.reduce((a,[,v])=>a+v,0),col=id=>S.subjects.find(s=>s.id===id)?.color||'#9ba4af',nm=id=>S.subjects.find(s=>s.id===id)?.name||'지운 과목';
 $('bySub').innerHTML=sum?'<div class="ttl">'+hm(sum)+'<small>'+rows.length+'과목</small></div><div class="split">'+rows.map(([id,v])=>'<i style="--c:'+col(id)+';width:'+(v/sum*100)+'%"></i>').join('')+'</div><div class="legend">'+rows.map(([id,v])=>'<div style="--c:'+col(id)+'"><i class="dot"></i><span>'+esc(nm(id))+'</span><b class="num">'+hm(v)+'</b></div>').join('')+'</div>':'<div class="empty">이번 주 기록이 아직 없어요</div>';
 const start0=shift(mon,-15*7);let g='',n=0;for(let k=0;k<16*7;k++){const d=shift(start0,k),v=m[d]||0;if(v&&d<=t)n++;g+='<i class="'+(d>t?'f':v>=180?'l3':v>=60?'l2':v?'l1':'')+'" title="'+d+' '+hm(v)+'"></i>'}
 $('grass').innerHTML=g;$('gTxt').textContent=n+'일';
 const ss=S.log.filter(x=>dayOf(x.start)===t).sort((a,b)=>b.start-a.start);
 $('sessions').innerHTML=ss.length?ss.map(x=>{const a=new Date(x.start),b=new Date(x.start+x.min*6e4),f=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return '<div class="sess" style="--c:'+col(x.sub)+'"><i class="dot"></i><span>'+esc(nm(x.sub))+' <small class="num">'+f(a)+'–'+f(b)+'</small></span><b class="num">'+hm(x.min)+'</b><button type="button" data-delsess="'+x.id+'" aria-label="기록 지우기">✕</button></div>'}).join(''):'<div class="empty">오늘 기록이 아직 없어요</div>';
}
// settings
function renderSet(){$('goalV').textContent=hm(S.goal);$('dsV').textContent=S.dayStart+'시';
 $('subsEdit').innerHTML=(S.subjects.map(s=>'<button type="button" class="sub" style="--c:'+s.color+'" data-edit="'+s.id+'"><span class="dot"></span><span class="nm"><strong>'+esc(s.name)+'</strong>'+(s.cert?'<small>🎓 자격증과 연결</small>':'')+'</span><span class="t">›</span></button>').join('')||'<div class="empty">과목이 없어요</div>')+'<button type="button" class="add" data-addsub>＋ 과목 추가</button>'}
function sheet(s){const isNew=!s;s=s||{id:uid(),name:'',color:freeColor()};let color=s.color;
 const certs=(read(CERTS,{})?.list||[]).filter(c=>c.goal||c.id===s.cert);
 $('sheet').innerHTML='<h3>'+(isNew?'과목 추가':'과목 수정')+'</h3><label for="sName">이름</label><input id="sName" maxlength="30" value="'+esc(s.name)+'" placeholder="예: 수학, 정보처리기사 필기" required><label>색</label><div class="colors">'+COLORS.map(c=>'<button type="button" style="--c:'+c+'" data-color="'+c+'" aria-label="색 '+c+'" aria-pressed="'+(c===color)+'"></button>').join('')+'</div>'
  +(certs.length?'<label for="sCert">자격증 연결</label><select id="sCert"><option value="">연결 안 함</option>'+certs.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===s.cert?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>':'')
  +'<div class="foot">'+(isNew?'':'<button type="button" class="del" data-del>삭제</button>')+'<button type="button" data-cancel>취소</button><button class="pri">저장</button></div>';
 $('sheetBg').hidden=false;
 $('sheet').querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;$('sheet').querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 $('sheet').querySelector('[data-cancel]').onclick=close;
 const del=$('sheet').querySelector('[data-del]');if(del)del.onclick=()=>{if(del.dataset.sure){if(S.run?.sub===s.id)stop();S.subjects=S.subjects.filter(x=>x.id!==s.id);if(s.cert&&!S.hide.includes(s.cert))S.hide.push(s.cert);save();close();all()}else{del.dataset.sure=1;del.textContent='정말 삭제'}};
 $('sheet').onsubmit=e=>{e.preventDefault();const name=$('sName').value.trim();if(!name)return;const cert=$('sCert')?.value||'';Object.assign(s,{name,color,cert:cert||undefined});if(isNew)S.subjects.push(s);save();close();all()}}
function close(){$('sheetBg').hidden=true}
$('sheetBg').onclick=e=>{if(e.target===$('sheetBg'))close()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.play){if(S.run?.sub===b.dataset.play)showFocus();else start(b.dataset.play)}
 else if('addsub' in b.dataset)sheet();
 else if(b.dataset.edit)sheet(S.subjects.find(s=>s.id===b.dataset.edit));
 else if(b.dataset.goal){S.goal=Math.min(16*60,Math.max(30,S.goal+ +b.dataset.goal));save();renderSet();render()}
 else if(b.dataset.ds){S.dayStart=(S.dayStart+ +b.dataset.ds+7)%7;save();renderSet();all()}
 else if(b.dataset.delsess){if(b.dataset.sure){const x=S.log.find(l=>l.id===b.dataset.delsess);if(x){S.log=S.log.filter(l=>l!==x);const s=S.subjects.find(v=>v.id===x.sub);if(s?.cert)certAdd(s.cert,dayOf(x.start),-x.min);save();all()}}else{b.dataset.sure=1;b.textContent='지우기';b.style.color='var(--red)';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='✕';b.style.color=''}},3000)}}
 else if(b.dataset.tab){document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.app>section').forEach(s=>s.hidden=s.id!==b.dataset.tab);scrollTo(0,0)}});
function all(){render();renderStats();renderSet()}
syncCerts();all();showFocus();setInterval(()=>{if(S.run&&$('focus').hidden)render()},1000);
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
</script></body></html>
