<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>추억의 레스토랑 · 실험판</title><style>*{box-sizing:border-box}body{margin:0;background:#f9e9c9;font-family:system-ui,sans-serif;color:#503726}header{background:#a63e3e;color:white;padding:12px;display:flex;justify-content:space-between}main{max-width:540px;margin:auto;padding:12px}.stats,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button{border:2px solid #ab704d;background:#fff4d9;border-radius:12px;padding:10px;font-weight:700;color:#613a23}button:disabled{opacity:.5}.scene{height:350px;position:relative;overflow:hidden;background:linear-gradient(#f7d8a3 0 25%,#cba36f 25% 26%,#efc992 26%);border:8px solid #a66c46;border-radius:14px;box-shadow:inset 0 0 0 4px #f8e1b4}.floor{position:absolute;inset:26% 0 0;background:repeating-linear-gradient(45deg,transparent 0 32px,#c89d6b55 33px 35px,transparent 36px 67px),repeating-linear-gradient(-45deg,transparent 0 32px,#c89d6b55 33px 35px,transparent 36px 67px)}.item{position:absolute;font-size:35px;filter:drop-shadow(1px 5px 2px #78573566);text-align:center}.item small{display:block;font-size:10px;background:#fff9;border-radius:8px}.person{transition:left 1.2s linear,top 1.2s linear}#message{min-height:44px;padding:10px;background:#fff8e8;border-radius:12px}.panel{background:#fff8e9;border:2px solid #d9aa78;border-radius:14px;padding:12px;margin-top:10px}h3{margin:4px 0 10px}#timer{font-weight:800;color:#a43d38}</style></head><body><header><b>🍜 추억의 레스토랑</b><span>실험판 v0.1</span></header><main><div class="stats"><button id="coins">🪙 0</button><button id="level">⭐ 레벨 1</button><button id="served">🍽️ 손님 0명</button></div><div class="scene"><div class="floor"></div><div class="item" style="left:6%;top:29%">🚪</div><div class="item" style="left:60%;top:31%">🍳<small>주방</small></div><div class="item" style="left:26%;top:47%">🪑<small>테이블 1</small></div><div class="item" style="left:65%;top:67%">🪑<small>테이블 2</small></div><div class="item person" id="guest" style="left:6%;top:43%">🧑</div><div id="furniture"></div></div><div class="panel"><h3>오늘의 영업</h3><div id="message" aria-live="polite">요리를 시작하면 손님이 찾아와요!</div><div class="actions"><button id="cook">🥟 만두 요리 (10초)</button><button id="sell" disabled>🍽️ 음식 판매 (+30)</button></div><div id="timer"></div></div><div class="panel"><h3>가구 상점</h3><div class="actions"><button id="plant">🪴 화분 구매 (60)</button><button id="lamp">🏮 등 구매 (90)</button></div><small>가구를 구매하면 레스토랑에 배치되고 자동 저장돼요.</small></div><div class="actions"><button id="back">← 아케이드로</button><button id="reset">게임 초기화</button></div></main><script>(()=>{'use strict';const key='fm_restaurant_proto_v1';const defaults=()=>({coins:100,level:1,xp:0,served:0,ready:false,finish:0,plants:0,lamps:0});let s;try{s={...defaults(),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{s=defaults()}const el=id=>document.getElementById(id);const save=()=>localStorage.setItem(key,JSON.stringify(s));const msg=t=>el('message').textContent=t;function draw(){if(s.finish&&Date.now()>=s.finish){s.finish=0;s.ready=true;save();msg('만두 완성! 음식을 판매해 보세요.')}el('coins').textContent='🪙 '+s.coins;el('level').textContent='⭐ 레벨 '+s.level+' ('+s.xp+'/100 XP)';el('served').textContent='🍽️ 손님 '+s.served+'명';el('cook').disabled=!!s.finish||s.ready;el('sell').disabled=!s.ready;el('timer').textContent=s.finish?'조리 중: '+Math.ceil((s.finish-Date.now())/1000)+'초 남음':s.ready?'요리 완성!':'주방 대기 중';el('furniture').innerHTML=Array.from({length:s.plants},(_,i)=>'<div class="item" style="left:'+(8+(i%4)*20)+'%;top:'+(64+Math.floor(i/4)*8)+'%">🪴</div>').join('')+Array.from({length:s.lamps},(_,i)=>'<div class="item" style="left:'+(17+(i%4)*20)+'%;top:15%">🏮</div>').join('')}el('cook').onclick=()=>{if(s.finish||s.ready)return;s.finish=Date.now()+10000;save();msg('만두를 만들고 있어요!');draw()};el('sell').onclick=()=>{if(!s.ready)return;s.ready=false;s.coins+=30;s.xp+=25;s.served++;if(s.xp>=100){s.xp-=100;s.level++;msg('레벨 업! 새로운 레벨 '+s.level)}else msg('손님이 맛있게 먹었어요! +30 코인');el('guest').style.left='30%';el('guest').style.top='54%';setTimeout(()=>{el('guest').style.left='6%';el('guest').style.top='43%'},1200);save();draw()};function buy(type,cost){if(s.coins<cost){msg('코인이 부족해요!');return}if(s[type]>=8){msg('이 가구는 최대 8개까지 배치할 수 있어요.');return}s.coins-=cost;s[type]++;save();draw();msg('새 가구를 배치했어요!')}el('plant').onclick=()=>buy('plants',60);el('lamp').onclick=()=>buy('lamps',90);el('back').onclick=()=>location.href='./index.html';el('reset').onclick=()=>{if(confirm('레스토랑 진행 데이터를 초기화할까요?')){s=defaults();save();draw();msg('새 레스토랑을 시작했어요!')}};draw();setInterval(draw,500)})();</script></body></html>
