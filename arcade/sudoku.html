<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a32"><title>Sudoku Journey · FIRE MATE ARCADE</title><style>
:root{color-scheme:dark;--bg:#0c1224;--card:#18223a;--line:#465576;--text:#f1f5ff;--muted:#aebbd4;--accent:#82d6c7;--tile:#202c47;--focus:#344f70;--same:#293e58;--bad:#f19b9b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#26365a,var(--bg) 70%);color:var(--text);font:15px system-ui,sans-serif;min-height:100dvh}body.light{color-scheme:light;--bg:#edf2f8;--card:#fff;--line:#8c9ab2;--text:#192641;--muted:#51627d;--accent:#167e77;--tile:#f4f7fc;--focus:#b7d9ec;--same:#e0ebf5;--bad:#b92736}button,a{font:inherit}button{cursor:pointer;touch-action:manipulation}a{color:inherit;text-decoration:none}.shell{max-width:560px;margin:auto;padding:12px 14px 32px}header,.stats,.toolbar,.controls,.digits,.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}header{margin-bottom:12px}header a,header button,.toolbar button,.controls button,.meta button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px}.hero{background:var(--card);border:1px solid #4b6281;border-radius:17px;padding:15px;margin-bottom:12px}.hero h1{margin:0 0 6px;font-size:23px}.muted{color:var(--muted);font-size:13px}.stats{margin:12px 0;flex-wrap:wrap}.stats span{font-size:13px}.stats b{display:block;font-size:18px;color:var(--accent)}.progress{height:7px;border-radius:10px;background:var(--tile);overflow:hidden}.progress div{height:100%;width:0;background:var(--accent);transition:width .2s}.toolbar{margin:10px 0;flex-wrap:wrap}.toolbar button{flex:1;min-width:80px}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));width:min(100%,480px);aspect-ratio:1;margin:12px auto;background:var(--line);border:3px solid var(--line);border-radius:7px;overflow:hidden;gap:1px}.cell{border:0;border-radius:0;min-width:0;min-height:0;padding:0;background:var(--tile);color:var(--text);font-size:clamp(17px,5.2vw,29px);font-weight:650;position:relative;display:flex;align-items:center;justify-content:center}.cell.fixed{font-weight:800}.cell.peer{background:var(--same)}.cell.selected{background:var(--focus);outline:2px solid var(--accent);outline-offset:-2px;z-index:1}.cell.match{color:var(--accent)}.cell.wrong{color:var(--bad)}.cell:nth-child(3n):not(:nth-child(9n)){border-right:2px solid var(--line)}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line)}.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;padding:2px;font-size:clamp(8px,2vw,11px);font-weight:500;color:var(--muted)}.notes span{display:grid;place-items:center}.digits{margin:10px 0;gap:4px}.digits button{flex:1;min-width:0;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;font-size:21px;font-weight:700;min-height:52px;padding:0}.digits button:disabled{opacity:.35}.controls{flex-wrap:wrap}.controls button{flex:1;min-width:90px;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text)}.controls .active{background:var(--accent);color:var(--bg);font-weight:800}.message{min-height:24px;text-align:center;color:var(--muted);margin:10px 0}.meta{flex-wrap:wrap;margin-top:12px}.meta button{flex:1}dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;max-width:min(92vw,440px);padding:24px;box-shadow:0 25px 70px #0008}dialog::backdrop{background:#000b}dialog h2{margin-top:0}dialog button{background:var(--accent);border:0;border-radius:10px;padding:12px 20px;font-weight:700;min-height:44px}dialog .secondary{background:var(--tile);color:var(--text);margin-left:8px}button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}@media(max-width:360px){.shell{padding:8px}.hero{padding:12px}.cell{font-size:18px}.toolbar button{padding:8px 5px;font-size:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="shell"><header><a href="./index.html">← 아케이드</a><strong>🧩 SUDOKU JOURNEY</strong><button id="theme" aria-label="테마 전환">☀︎</button></header><section class="hero"><h1 id="stage">스테이지 1</h1><div class="muted" id="tier">입문 · 두뇌 여행의 시작</div><div class="stats"><span>완료<b id="done">0</b></span><span>최고 연속<b id="streak">0</b></span><span>별 획득<b id="stars">0 ★</b></span><span>진행 시간<b id="time">00:00</b></span></div><div class="progress"><div id="progress"></div></div></section><div class="toolbar"><button id="prev">◀ 이전</button><button id="next">다음 ▶</button><button id="go">스테이지 선택</button></div><div class="board" id="board" role="grid" aria-label="스도쿠 9 곱하기 9 퍼즐"></div><div class="digits" id="digits"></div><div class="controls"><button id="notes">✎ 메모 OFF</button><button id="erase">⌫ 지우기</button><button id="undo">↶ 실행 취소</button><button id="hint">💡 힌트</button></div><p class="message" id="message" aria-live="polite">칸을 선택하고 숫자를 입력하세요.</p><div class="meta"><button id="check">오류 확인</button><button id="reset">퍼즐 다시 시작</button><button id="help">도움말</button></div></main><dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalActions"></div></dialog><script>
(()=>{'use strict';
const KEY='sudoku_journey_v1',el=id=>document.getElementById(id),board=el('board'),modal=el('modal');const levels=['입문','쉬움','보통','도전','어려움','전문가','마스터','전설'];const minClues=[45,41,37,34,31,29,27,25];const TOTAL=1000;
const fresh=()=>({unlocked:1,cleared:{},stage:1,plays:{},bestStreak:0,streak:0,stars:0,theme:'dark'});
let data=fresh();try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object'){data={...data,...raw};data.unlocked=Math.max(1,Math.min(TOTAL,Math.floor(+data.unlocked||1)));data.stage=Math.max(1,Math.min(data.unlocked,Math.floor(+data.stage||1)));data.plays=raw.plays&&typeof raw.plays==='object'?raw.plays:{};data.cleared=raw.cleared&&typeof raw.cleared==='object'?raw.cleared:{}}}catch(e){}
let puzzle=[],solution=[],entries=[],notes=[],selected=0,noteMode=false,history=[],seconds=0,last=Date.now(),busy=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){msg('저장 공간 부족: 진행 상황을 저장하지 못했어요.')}}
function rng(seed){let x=seed|0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateSolved(r){const base=(row,col)=>(row*3+Math.floor(row/3)+col)%9;let bands=shuffle([0,1,2],r),stacks=shuffle([0,1,2],r),rows=bands.flatMap(b=>shuffle([0,1,2],r).map(i=>b*3+i)),cols=stacks.flatMap(b=>shuffle([0,1,2],r).map(i=>b*3+i)),digits=shuffle([1,2,3,4,5,6,7,8,9],r);return Array.from({length:81},(_,i)=>digits[base(rows[Math.floor(i/9)],cols[i%9])])}
function candidates(grid,i){if(grid[i])return 0;let row=Math.floor(i/9),col=i%9,used=0;for(let k=0;k<9;k++){used|=1<<grid[row*9+k];used|=1<<grid[k*9+col];used|=1<<grid[(Math.floor(row/3)*3+Math.floor(k/3))*9+Math.floor(col/3)*3+k%3]}return 0x3fe&~used}
function countSolutions(grid,limit=2){let best=-1,bits=0,min=10;for(let i=0;i<81;i++)if(!grid[i]){let b=candidates(grid,i),n=popcount(b);if(!n)return 0;if(n<min){min=n;best=i;bits=b;if(n===1)break}}if(best<0)return 1;let total=0;for(let n=1;n<=9;n++)if(bits&(1<<n)){grid[best]=n;total+=countSolutions(grid,limit-total);if(total>=limit)break}grid[best]=0;return total}
function popcount(x){let n=0;while(x){x&=x-1;n++}return n}
function tierOf(stage){return Math.min(7,Math.floor((stage-1)/125))}
function create(stage){let tier=tierOf(stage),r=rng((stage*2654435761)^0x5a71f00d),sol=generateSolved(r),grid=sol.slice(),order=shuffle(Array.from({length:81},(_,i)=>i),r),target=Math.max(minClues[tier],minClues[tier]+3-Math.floor(((stage-1)%125)/32));let clues=81;for(let i of order){if(clues<=target)break;let keep=grid[i];grid[i]=0;if(countSolutions(grid.slice())!==1)grid[i]=keep;else clues--}return {puzzle:grid,solution:sol,clues}}
function msg(s){el('message').textContent=s}
function snapshot(){history.push({entries:entries.slice(),notes:notes.slice(),seconds});if(history.length>80)history.shift()}
function savePlay(){data.plays[data.stage]={entries,notes,seconds};save()}
function load(stage){if(busy)return;data.stage=stage;save();busy=true;msg('퍼즐 생성 중…');setTimeout(()=>{try{let g=create(stage);puzzle=g.puzzle;solution=g.solution;let saved=data.plays[stage];entries=Array.isArray(saved?.entries)&&saved.entries.length===81?saved.entries.map((n,i)=>puzzle[i]?puzzle[i]:(n===solution[i]?n:(Number.isInteger(n)&&n>=0&&n<=9?n:0))):puzzle.slice();notes=Array.isArray(saved?.notes)&&saved.notes.length===81?saved.notes.map(n=>Number.isInteger(n)?n&0x3fe:0):Array(81).fill(0);seconds=Math.max(0,Math.floor(+saved?.seconds||0));selected=0;history=[];busy=false;last=Date.now();render();msg('정답은 하나! 차근차근 풀어보세요.')}catch(e){busy=false;msg('퍼즐을 생성하지 못했어요. 다시 시도해 주세요.')}},0)}
function conflict(i){let n=entries[i];if(!n)return false;let row=Math.floor(i/9),col=i%9;for(let j=0;j<81;j++){if(i===j||entries[j]!==n)continue;let rr=Math.floor(j/9),cc=j%9;if(rr===row||cc===col||(Math.floor(rr/3)===Math.floor(row/3)&&Math.floor(cc/3)===Math.floor(col/3)))return true}return false}
function render(){el('stage').textContent='스테이지 '+data.stage+' / '+TOTAL;let tier=tierOf(data.stage);el('tier').textContent=levels[tier]+' · '+(data.cleared[data.stage]?'완료한 퍼즐 다시 도전':'다음 단계로 가는 두뇌 여행');el('done').textContent=Object.keys(data.cleared).length;el('streak').textContent=data.bestStreak;el('stars').textContent=data.stars+' ★';el('progress').style.width=(100*Object.keys(data.cleared).length/TOTAL)+'%';el('prev').disabled=data.stage===1;el('next').disabled=data.stage>=data.unlocked;el('notes').textContent='✎ 메모 '+(noteMode?'ON':'OFF');el('notes').classList.toggle('active',noteMode);board.replaceChildren();for(let i=0;i<81;i++){let btn=document.createElement('button');btn.type='button';btn.className='cell'+(puzzle[i]?' fixed':'')+(selected===i?' selected':'')+(selected!==i&&(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||(Math.floor(i/27)===Math.floor(selected/27)&&Math.floor(i%9/3)===Math.floor(selected%9/3)))?' peer':'')+(entries[i]&&entries[i]===entries[selected]&&selected!==i?' match':'')+(conflict(i)?' wrong':'');btn.setAttribute('role','gridcell');btn.setAttribute('aria-label',Math.floor(i/9)+1+'행 '+(i%9+1)+'열 '+(entries[i]||'빈 칸')+(puzzle[i]?' 고정':''));if(entries[i])btn.textContent=entries[i];else if(notes[i]){let n=document.createElement('span');n.className='notes';for(let d=1;d<=9;d++){let v=document.createElement('span');v.textContent=notes[i]&(1<<d)?d:'';n.append(v)}btn.append(n)}btn.onclick=()=>{selected=i;render()};board.append(btn)}el('time').textContent=fmt(seconds);for(let n=1;n<=9;n++)el('num'+n).disabled=entries.filter(x=>x===n).length>=9}
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function put(n){if(busy||puzzle[selected]||data.cleared[data.stage])return;snapshot();if(noteMode&&n){notes[selected]^=1<<n}else{entries[selected]=n;notes[selected]=0}savePlay();render();if(entries.every((v,i)=>v===solution[i]))complete()}
function hint(){if(busy||data.cleared[data.stage])return;let blanks=entries.map((v,i)=>v!==solution[i]&&!puzzle[i]?i:-1).filter(i=>i>=0);if(!blanks.length)return;selected=blanks[0];snapshot();entries[selected]=solution[selected];notes[selected]=0;data.plays[data.stage].hints=(data.plays[data.stage].hints||0)+1;savePlay();render();msg('힌트를 사용했어요. 별점에 반영돼요.');if(entries.every((v,i)=>v===solution[i]))complete()}
function showDialog(title,text,buttons){el('modalTitle').textContent=title;el('modalText').textContent=text;el('modalActions').replaceChildren();for(const [label,fn,secondary] of buttons){let b=document.createElement('button');b.textContent=label;if(secondary)b.className='secondary';b.onclick=()=>{modal.close();fn()};el('modalActions').append(b)}modal.showModal()}
function complete(){let stage=data.stage,old=data.cleared[stage],hints=data.plays[stage]?.hints||0,score=hints===0?3:hints<=2?2:1;if(!old){data.streak++;data.bestStreak=Math.max(data.bestStreak,data.streak);data.cleared[stage]=score;data.stars+=score;data.unlocked=Math.min(TOTAL,Math.max(data.unlocked,stage+1))}else if(score>old){data.cleared[stage]=score;data.stars+=score-old}delete data.plays[stage];save();render();showDialog('🎉 스테이지 '+stage+' 클리어!',levels[tierOf(stage)]+' 완료 · '+('★'.repeat(score))+' · '+fmt(seconds)+' · 총 '+Object.keys(data.cleared).length+'개 완료',[['다음 스테이지',()=>load(Math.min(data.unlocked,stage+1))],['다시 보기',()=>{} ,true]])}
function selectStage(){let val=prompt('이동할 스테이지 번호 (1 ~ '+data.unlocked+')',String(data.stage));if(val===null)return;let n=Number(val);if(!Number.isInteger(n)||n<1||n>data.unlocked){msg('해금된 스테이지만 선택할 수 있어요.');return}load(n)}
for(let n=1;n<=9;n++){let b=document.createElement('button');b.id='num'+n;b.textContent=n;b.setAttribute('aria-label',n+' 입력');b.onclick=()=>put(n);el('digits').append(b)}
el('prev').onclick=()=>load(Math.max(1,data.stage-1));el('next').onclick=()=>load(Math.min(data.unlocked,data.stage+1));el('go').onclick=selectStage;el('notes').onclick=()=>{noteMode=!noteMode;render()};el('erase').onclick=()=>put(0);el('undo').onclick=()=>{let v=history.pop();if(!v)return;entries=v.entries;notes=v.notes;savePlay();render()};el('hint').onclick=hint;el('check').onclick=()=>{let wrong=entries.filter((v,i)=>v&&v!==solution[i]).length;msg(wrong?'정답과 다른 칸 '+wrong+'개가 있어요.':'현재 입력한 숫자는 모두 정답이에요!')};el('reset').onclick=()=>showDialog('퍼즐 다시 시작','현재 스테이지의 입력과 메모를 지울까요?',[['다시 시작',()=>{delete data.plays[data.stage];save();load(data.stage)}],['취소',()=>{},true]]);el('help').onclick=()=>showDialog('플레이 방법','가로줄·세로줄·3×3 구역에 1부터 9까지 한 번씩 넣으세요. 메모, 실행 취소, 힌트를 지원합니다. 정답이 하나인 1,000개 스테이지가 순서대로 열립니다.',[['확인',()=>{}]]);el('theme').onclick=()=>{data.theme=data.theme==='light'?'dark':'light';document.body.classList.toggle('light',data.theme==='light');save()};document.body.classList.toggle('light',data.theme==='light');
document.addEventListener('keydown',e=>{if(modal.open||e.ctrlKey||e.metaKey||e.altKey)return;if(/^[1-9]$/.test(e.key)){put(+e.key);e.preventDefault()}else if(e.key==='Backspace'||e.key==='Delete'){put(0);e.preventDefault()}else if(e.key.startsWith('Arrow')){let row=Math.floor(selected/9),col=selected%9;if(e.key==='ArrowUp')row=Math.max(0,row-1);if(e.key==='ArrowDown')row=Math.min(8,row+1);if(e.key==='ArrowLeft')col=Math.max(0,col-1);if(e.key==='ArrowRight')col=Math.min(8,col+1);selected=row*9+col;render();e.preventDefault()}else if(e.key.toLowerCase()==='n'){noteMode=!noteMode;render()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){savePlay();last=Date.now()}else last=Date.now()});setInterval(()=>{if(!busy&&!modal.open&&!document.hidden&&!data.cleared[data.stage]){let now=Date.now();seconds+=Math.min(2,Math.max(0,Math.round((now-last)/1000)));last=now;el('time').textContent=fmt(seconds);if(seconds%10===0)savePlay()}else last=Date.now()},1000);
load(data.stage);
})();</script></body></html>
