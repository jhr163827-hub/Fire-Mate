<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c18"><title>NIGHTFALL SURVIVORS · Art Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#090c18;color:#f4e9d3;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 4px #000}header a,header button{pointer-events:auto;background:#171c33;color:#fff;border:1px solid #67708a;border-radius:10px;padding:9px;text-decoration:none;font-size:13px}#hud{font-size:13px;text-align:center}#xp{position:fixed;top:calc(env(safe-area-inset-top) + 54px);left:10%;width:80%;height:7px;border-radius:9px;background:#313a4d;overflow:hidden}#xp>div{height:100%;width:0;background:#a5f3d0}#panel{position:fixed;inset:0;background:#060916d9;display:flex;align-items:center;justify-content:center;padding:22px}#panel[hidden]{display:none}.card{background:linear-gradient(145deg,#27304d,#12182a);border:1px solid #7783a6;border-radius:20px;padding:22px;width:min(420px,100%);text-align:center;box-shadow:0 20px 60px #0009}.card h1{font-size:25px;letter-spacing:2px}.card p{color:#c5cde2;line-height:1.6}.card button{width:100%;margin:7px 0;padding:15px;background:#374b72;color:white;border:1px solid #9ca9ce;border-radius:12px;font-size:16px;font-weight:700}.card button:active{background:#5675a9}#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);width:100%;text-align:center;color:#c1c9d9;font-size:12px;pointer-events:none}</style></head><body><canvas id="game" aria-label="나이트폴 서바이버즈 전투 화면"></canvas><header><a href="./index.html">← 아케이드</a><div id="hud">00:00 · Lv 1 · HP 100</div><button id="pause">일시정지</button></header><div id="xp"><div id="xpfill"></div></div><div id="hint">화면을 드래그해 이동 · 공격은 자동</div><div id="panel"><div class="card"><h1 id="title">NIGHTFALL<br>SURVIVORS</h1><p id="desc">저주받은 숲에서 살아남으세요.<br>몬스터를 피하고 마법으로 처치하세요.</p><div id="choices"></div></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),panel=document.getElementById('panel'),title=document.getElementById('title'),desc=document.getElementById('desc'),choices=document.getElementById('choices'),hud=document.getElementById('hud'),xpfill=document.getElementById('xpfill');const art={};for(const name of ['mage','wraith','fiend']){const im=new Image();im.src='./nightfall-'+name+'.svg';art[name]=im}let w=0,h=0,dpr=1,state='menu',last=0,elapsed=0,spawn=0,shot=0,level=1,xp=0,need=6,kills=0,enemy=[],bolts=[],gems=[],particles=[],touch=null,keys=new Set(),player={x:0,y:0,hp:100,max:100,speed:190,power:24,rate:.62,multi:1,range:300,inv:0};function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function button(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;choices.append(b)}function show(t,d,opts){state='pause';panel.hidden=false;title.textContent=t;desc.textContent=d;choices.replaceChildren();opts.forEach(o=>button(o[0],o[1]))}function start(){elapsed=spawn=shot=xp=kills=0;level=1;enemy=[];bolts=[];gems=[];particles=[];need=6;player={x:0,y:0,hp:100,max:100,speed:190,power:24,rate:.62,multi:1,range:300,inv:0};state='play';panel.hidden=true;last=performance.now()}function upgrade(){let pool=[['마법 강화 · 피해 +8',()=>player.power+=8],['신속한 주문 · 공격 간격 -12%',()=>player.rate=Math.max(.17,player.rate*.88)],['신속한 발걸음 · 이동 +15%',()=>player.speed+=15],['생명력 강화 · 최대 HP +25',()=>{player.max+=25;player.hp=Math.min(player.max,player.hp+35)}],['다중 마법 · 투사체 +1',()=>player.multi=Math.min(5,player.multi+1)],['치유 · HP +40',()=>player.hp=Math.min(player.max,player.hp+40)]];pool.sort(()=>Math.random()-.5);show('LEVEL '+level,'강화할 능력을 선택하세요.',pool.slice(0,3).map(([n,fn])=>[n,()=>{fn();state='play';panel.hidden=true;last=performance.now()}]))}function over(){let best=0;try{best=Number(localStorage.getItem('nightfall_best_v1')||0);if(kills>best)localStorage.setItem('nightfall_best_v1',String(kills))}catch(e){}show('GAME OVER','생존 '+Math.floor(elapsed)+'초 · 처치 '+kills+'마리 · 최고 '+Math.max(kills,best)+'마리',[['다시 도전',start],['아케이드로 돌아가기',()=>location.href='./index.html']])}function pause(){if(state==='play')show('일시정지','잠시 쉬어가세요.',[['계속하기',()=>{state='play';panel.hidden=true;last=performance.now()}],['처음부터',start]]);else if(state==='pause'&&panel.hidden===false){state='play';panel.hidden=true;last=performance.now()}}document.getElementById('pause').onclick=()=>{if(state==='play')pause()};addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='Escape'&&state==='play')pause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('pointerdown',e=>{touch={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(touch&&touch.id===e.pointerId){touch.x=e.clientX;touch.y=e.clientY}});function clear(e){if(touch&&touch.id===e.pointerId)touch=null}c.addEventListener('pointerup',clear);c.addEventListener('pointercancel',clear);button('생존 시작',start);function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function tick(dt){elapsed+=dt;player.inv=Math.max(0,player.inv-dt);let dx=0,dy=0;if(touch){dx=(touch.x-touch.sx)/55;dy=(touch.y-touch.sy)/55}else{dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'))}let m=Math.hypot(dx,dy);if(m>0){player.x+=dx/Math.max(1,m)*player.speed*dt;player.y+=dy/Math.max(1,m)*player.speed*dt}spawn-=dt;if(spawn<=0&&enemy.length<160){spawn=Math.max(.18,.9-elapsed/170);let a=Math.random()*Math.PI*2,r=Math.max(w,h)*.7+80;let tough=1+elapsed/90;{let type=Math.random()<Math.min(.55,.2+elapsed/250)?'fiend':'wraith',hp=(type==='fiend'?48:26)*tough;enemy.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,hp,max:hp,type,speed:(type==='fiend'?78:50)+Math.min(65,elapsed/7),radius:type==='fiend'?17:13,hit:0})}}shot-=dt;if(shot<=0){shot=player.rate;let targets=enemy.filter(e=>dist(e,player)<player.range).sort((a,b)=>dist(a,player)-dist(b,player));for(let e of targets.slice(0,player.multi)){let a=Math.atan2(e.y-player.y,e.x-player.x);bolts.push({x:player.x,y:player.y,vx:Math.cos(a)*470,vy:Math.sin(a)*470,life:1.1,power:player.power,kind:level>=5&&Math.random()<.32?'ice':level>=3&&Math.random()<.5?'fire':'arcane'})}}for(let e of enemy){let d=dist(e,player)||1;e.x+=(player.x-e.x)/d*e.speed*dt;e.y+=(player.y-e.y)/d*e.speed*dt;if(d<e.radius+12&&player.inv<=0){player.hp-=12;player.inv=.65;if(player.hp<=0){over();return}}}for(let b of bolts){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemy){if(e.hp>0&&dist(b,e)<e.radius+6){e.hp-=b.power*(b.kind==='fire'?1.3:1);if(b.kind==='ice')e.speed=Math.max(25,e.speed*.88);if(b.kind==='fire')for(let other of enemy)if(other!==e&&dist(other,e)<42)other.hp-=b.power*.35;b.life=0;particles.push({x:e.x,y:e.y,life:.2,kind:b.kind});break}}}bolts=bolts.filter(b=>b.life>0);for(let e of enemy)if(e.hp<=0){kills++;gems.push({x:e.x,y:e.y,value:1})}enemy=enemy.filter(e=>e.hp>0);for(let g of gems){let d=dist(g,player);if(d<110){g.x+=(player.x-g.x)/Math.max(1,d)*Math.min(420,100+450/(d+1))*dt;g.y+=(player.y-g.y)/Math.max(1,d)*Math.min(420,100+450/(d+1))*dt}if(d<20){xp+=g.value;g.value=0}}gems=gems.filter(g=>g.value>0);particles.forEach(p=>p.life-=dt);particles=particles.filter(p=>p.life>0);if(xp>=need){xp-=need;level++;need=Math.ceil(need*1.35+2);upgrade()}hud.textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0')+' · Lv '+level+' · HP '+Math.ceil(player.hp)+'/'+player.max+' · '+kills+' K';xpfill.style.width=(100*xp/need)+'%'}function draw(){let t=elapsed;ctx.fillStyle='#0b121a';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-player.x,h/2-player.y);let left=player.x-w/2,top=player.y-h/2;const hash=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};let tile=96;for(let gx=Math.floor(left/tile)-1;gx<=Math.floor((left+w)/tile)+1;gx++)for(let gy=Math.floor(top/tile)-1;gy<=Math.floor((top+h)/tile)+1;gy++){let x=gx*tile,y=gy*tile,v=hash(gx,gy);ctx.fillStyle=v>.65?'#182a2b':v>.32?'#152526':'#122123';ctx.fillRect(x,y,tile+1,tile+1);ctx.fillStyle='#223c35';for(let k=0;k<4;k++){let px=x+hash(gx+k,gy+7)*tile,py=y+hash(gx+8,gy+k)*tile;ctx.beginPath();ctx.ellipse(px,py,2,5,hash(gx,gy+k)*6,0,7);ctx.fill()}if(v>.78){let px=x+tile*.5,py=y+tile*.42;ctx.fillStyle='#07151977';ctx.beginPath();ctx.ellipse(px+10,py+17,30,11,0,0,7);ctx.fill();ctx.fillStyle='#253d39';ctx.beginPath();ctx.moveTo(px,py-23);ctx.lineTo(px+23,py+11);ctx.lineTo(px-22,py+12);ctx.fill();ctx.fillStyle='#3b5550';ctx.beginPath();ctx.moveTo(px,py-33);ctx.lineTo(px+14,py+3);ctx.lineTo(px-13,py+4);ctx.fill()}else if(v<.12){ctx.fillStyle='#536367';ctx.beginPath();ctx.ellipse(x+45,y+46,19,11,-.3,0,7);ctx.fill();ctx.fillStyle='#72817d';ctx.beginPath();ctx.ellipse(x+42,y+42,14,6,-.3,0,7);ctx.fill()}}for(let g of gems){ctx.shadowColor='#5cfed4';ctx.shadowBlur=12;ctx.fillStyle='#7efbd9';ctx.beginPath();ctx.moveTo(g.x,g.y-8);ctx.lineTo(g.x+6,g.y);ctx.lineTo(g.x,g.y+8);ctx.lineTo(g.x-6,g.y);ctx.closePath();ctx.fill();ctx.shadowBlur=0}for(let e of enemy){let phase=Math.sin(t*(e.type==='fiend'?10:6)+e.x*.01)*2,im=art[e.type];if(im.complete&&im.naturalWidth){ctx.save();ctx.translate(e.x,e.y+phase);if(e.x>player.x)ctx.scale(-1,1);ctx.drawImage(im,-26,-35,52,61);ctx.restore()}else{ctx.fillStyle=e.type==='fiend'?'#9b4054':'#9aa7bd';ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,7);ctx.fill()}}for(let b of bolts){let color=b.kind==='fire'?'#ff974e':b.kind==='ice'?'#a5f8ff':'#87baff';ctx.shadowColor=color;ctx.shadowBlur=24;ctx.strokeStyle=color;ctx.lineWidth=b.kind==='ice'?7:5;ctx.beginPath();ctx.moveTo(b.x-b.vx*.032,b.y-b.vy*.032);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill();ctx.shadowBlur=0}for(let p of particles){ctx.shadowColor='#ffd18a';ctx.shadowBlur=24;ctx.fillStyle='#ffbf74';ctx.beginPath();ctx.arc(p.x,p.y,21*p.life/.2,0,7);ctx.fill();ctx.shadowBlur=0}let moving=touch||keys.size>0,bob=moving?Math.sin(t*13)*2:Math.sin(t*3)*.8;let im=art.mage;if(im.complete&&im.naturalWidth){ctx.save();ctx.translate(player.x,player.y+bob);if(touch&&touch.x<touch.sx||keys.has('a')||keys.has('arrowleft'))ctx.scale(-1,1);ctx.globalAlpha=player.inv>0&&Math.floor(t*14)%2?.55:1;ctx.drawImage(im,-32,-48,64,75);ctx.restore()}else{ctx.fillStyle='#8aafd2';ctx.beginPath();ctx.arc(player.x,player.y,15,0,7);ctx.fill()}ctx.restore();let vignette=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.15,w/2,h/2,Math.max(w,h)*.75);vignette.addColorStop(0,'#0000');vignette.addColorStop(1,'#01020b99');ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h);if(touch&&state==='play'){ctx.strokeStyle='#b3caff88';ctx.lineWidth=3;ctx.beginPath();ctx.arc(touch.sx,touch.sy,45,0,7);ctx.stroke();ctx.fillStyle='#b3caff88';ctx.beginPath();ctx.arc(touch.sx+Math.max(-45,Math.min(45,touch.x-touch.sx)),touch.sy+Math.max(-45,Math.min(45,touch.y-touch.sy)),18,0,7);ctx.fill()}}function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(state==='play')tick(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
