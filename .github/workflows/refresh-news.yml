name: Refresh news
on:
  workflow_dispatch:
  schedule:
    # Every hour from 06:00 to 23:00 KST (21:00–14:00 UTC).
    - cron: '23 21-23,0-14 * * *'
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/refresh_news.py
      - name: Commit news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart-data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh news"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
