<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211b32"><title>아케이드 · 추억의 레스토랑</title><style>*{box-sizing:border-box}body{margin:0;background:#211b32;color:#fff5eb;font-family:system-ui,sans-serif}main{max-width:550px;margin:auto;padding:15px}a,button{color:inherit;text-decoration:none;background:#574063;border:1px solid #9578a4;border-radius:12px;padding:11px;font-weight:700}button:disabled{opacity:.4}header,.stats,.actions,.bar{display:flex;justify-content:space-between;gap:8px;align-items:center}h1{font-size:25px;margin:20px 0 8px}.stats>div{flex:1;text-align:center;background:#493650;border-radius:13px;padding:10px}.stats small{display:block;color:#e2c3dc}.scene{background:linear-gradient(#b56f7c 0 43%,#e5b39b 43% 100%);border:5px solid #65405e;border-radius:20px;min-height:285px;margin:14px 0;position:relative;overflow:hidden}.sign{margin:12px auto;background:#6e3456;width:max-content;padding:9px 24px;border-radius:9px;box-shadow:0 5px #50263f}.counter{position:absolute;bottom:14px;left:6%;right:6%;height:60px;background:#955f54;border:5px solid #70433f;border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:30px}.guest{position:absolute;bottom:85px;left:8%;right:8%;display:flex;align-items:end;justify-content:space-around;font-size:48px}.bubble{font-size:14px;background:#fffdf3;color:#43283d;border-radius:14px;padding:8px;min-height:45px;max-width:165px}.panel{background:#42334c;border-radius:16px;padding:14px;margin:12px 0}.panel h2{font-size:17px;margin:0 0 12px}.recipes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.recipes button{display:flex;flex-direction:column;gap:4px;align-items:center}.recipes button b{font-size:29px}.recipes button small{font-size:11px;color:#ead7e7}.actions button{flex:1}.bar{margin:8px 0;color:#eacfe6;font-size:13px}.meter{height:10px;border-radius:10px;background:#231c2b;overflow:hidden}.meter>div{height:100%;background:#f6c76c;width:0;transition:width .2s}.note{color:#e8d4e5;font-size:13px;line-height:1.5}.status{min-height:24px;color:#ffe6a0}#serve{background:#a34f72}#upgrade{width:100%}</style></head><body><main><header><a href="./index.html">← 게임 아케이드</a><span>🍳 RESTAURANT 02</span></header><h1>🍜 추억의 레스토랑</h1><p class="note">손님의 주문을 받고 요리해서 서빙하는 나만의 작은 식당!</p><div class="stats"><div><small>매출 코인</small><strong id="coins">0</strong></div><div><small>서빙 완료</small><strong id="served">0</strong></div><div><small>식당 레벨</small><strong id="level">1</strong></div></div><div class="scene"><div class="sign">🍴 나의 레스토랑 🍴</div><div class="guest"><span id="guest">🧑‍🍳</span><span class="bubble" id="order">어서 오세요!</span><span>🧑</span></div><div class="counter" id="plate">🍽️</div></div><div class="panel"><h2>🧾 손님 주문</h2><div id="status" class="status" role="status">손님을 기다리는 중...</div><div class="bar"><span>손님 기다림</span><span id="time">—</span></div><div class="meter"><div id="patience"></div></div></div><div class="panel"><h2>👩‍🍳 요리 만들기</h2><div class="recipes"><button data-dish="0"><b>🍜</b>라면<small>3초 · 15코인</small></button><button data-dish="1"><b>🍛</b>카레<small>5초 · 25코인</small></button><button data-dish="2"><b>🍔</b>버거<small>7초 · 35코인</small></button></div><div class="bar"><span>요리 진행</span><span id="cookTime">준비 완료</span></div><div class="meter"><div id="progress"></div></div><div class="actions"><button id="serve" disabled>🍽️ 서빙하기</button><button id="discard" disabled>↺ 요리 버리기</button></div></div><div class="panel"><h2>🏪 식당 꾸미기 · 업그레이드</h2><button id="upgrade">✨ 주방 업그레이드 (100코인)</button><p class="note">레벨이 오르면 요리 시간이 줄어들어요. 코인과 레벨은 자동 저장돼요.</p></div><button id="newGame">기록 초기화</button><p class="note">※ 원작 이미지·음원은 사용하지 않은 독립적인 레스토랑 게임의 첫 버전입니다.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='firemate_arcade_restaurant_v1',dishes=[{emoji:'🍜',name:'라면',ms:3000,price:15},{emoji:'🍛',name:'카레',ms:5000,price:25},{emoji:'🍔',name:'버거',ms:7000,price:35}];let data={coins:0,served:0,level:1},order=-1,deadline=0,cooking=-1,cookEnd=0,ready=-1,nextGuest=0,last=0;try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Number.isFinite(x.coins)&&Number.isFinite(x.served)&&Number.isFinite(x.level))data={coins:Math.max(0,x.coins),served:Math.max(0,x.served),level:Math.max(1,Math.min(20,x.level))}}catch{}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}function ui(){ $('coins').textContent=data.coins;$('served').textContent=data.served;$('level').textContent=data.level;$('upgrade').textContent='✨ 주방 업그레이드 ('+(data.level*100)+'코인)';$('upgrade').disabled=data.coins<data.level*100||data.level>=20;$('serve').disabled=ready<0||ready!==order;$('discard').disabled=ready<0;$('plate').textContent=ready<0?'🍽️':dishes[ready].emoji}function guest(){order=Math.floor(Math.random()*dishes.length);deadline=Date.now()+22000;$('order').textContent=dishes[order].emoji+' '+dishes[order].name+' 주세요!';$('status').textContent='주문: '+dishes[order].name;$('guest').textContent=['👩','🧑','👨','👵','👩‍🦱'][Math.floor(Math.random()*5)];ui()}function cook(i){if(cooking>=0||ready>=0)return;cooking=i;cookEnd=Date.now()+Math.max(900,dishes[i].ms*(1-(data.level-1)*.055));$('status').textContent=dishes[i].name+' 요리 중...'}document.querySelectorAll('[data-dish]').forEach(b=>b.onclick=()=>cook(+b.dataset.dish));$('serve').onclick=()=>{if(ready!==order||order<0)return;data.coins+=dishes[order].price;data.served++;save();ready=-1;order=-1;nextGuest=Date.now()+1200;$('order').textContent='맛있어요! 💕';$('status').textContent='서빙 성공! +'+dishes[ready]?.price;ui();$('status').textContent='서빙 성공! 다음 손님이 곧 와요.'};$('discard').onclick=()=>{ready=-1;$('status').textContent='요리를 버렸어요.';ui()};$('upgrade').onclick=()=>{const cost=data.level*100;if(data.coins<cost||data.level>=20)return;data.coins-=cost;data.level++;save();ui();$('status').textContent='주방 업그레이드 완료! 🎉'};$('newGame').onclick=()=>{if(!confirm('식당 코인·레벨·서빙 기록을 초기화할까요?'))return;data={coins:0,served:0,level:1};save();ui()};function tick(){const now=Date.now();if(order<0&&now>=nextGuest)guest();if(order>=0){const left=Math.max(0,deadline-now);$('time').textContent=Math.ceil(left/1000)+'초';$('patience').style.width=(left/22000*100)+'%';if(left===0){order=-1;nextGuest=now+1300;$('order').textContent='다음에 올게요...';$('status').textContent='손님이 기다리다 떠났어요.';ui()}}else{$('time').textContent='—';$('patience').style.width='0%'}if(cooking>=0){const total=Math.max(900,dishes[cooking].ms*(1-(data.level-1)*.055)),left=Math.max(0,cookEnd-now);$('cookTime').textContent=Math.ceil(left/1000)+'초';$('progress').style.width=((total-left)/total*100)+'%';if(left===0){ready=cooking;cooking=-1;$('status').textContent=dishes[ready].name+' 완성! 서빙하세요.';ui()}}else{$('cookTime').textContent=ready>=0?'요리 완성':'준비 완료';$('progress').style.width=ready>=0?'100%':'0%'}setTimeout(tick,100)}ui();nextGuest=Date.now()+700;tick();
})();
</script></body></html>
