name: Refresh Korean stock charts
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: kr-chart-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-kr-charts.txt
      - run: pip install -r requirements-kr-charts.txt
      - name: Refresh next KRX stock and ETF batch
        env:
          KR_CHART_BATCH: '120'
        run: python scripts/refresh_kr_charts.py
      - name: Commit only chart data and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart-data/KR-*.json .kr-chart-cursor
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Korean stock and ETF chart histories"
            # Replay the generated data commit on the newest main to avoid fetch-first races.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
