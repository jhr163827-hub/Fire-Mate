name: FIRE MATE safety checks
on:
  push:
    paths:
      - 'index.html'
      - 'app.css'
      - 'js/**'
      - 'sw.js'
      - 'scripts/check_app.py'
      - 'scripts/test_calculations.cjs'
      - 'tests/storage-rollback.test.cjs'
      - 'tests/pwa-update.test.cjs'
      - 'tests/app-source.cjs'
      - '.github/workflows/app-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Read-only look at the live Cloudflare functions (they cannot be reached from the dev sandbox). Never fails the job.
      - name: Probe live news and quotes functions
        continue-on-error: true
        run: |
          for u in "news?s=SCHD,360750" "quotes?s=SCHD"; do
            echo "== $u"; curl -sS -m 40 -w '\nHTTP %{http_code} %{content_type}\n' "https://fire-mate-627.pages.dev/api/$u" | cut -c1-900
          done
          # On a work branch, also its preview (Cloudflare needs about a minute to deploy it).
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            sleep 80; b=$(echo "$GITHUB_REF_NAME" | tr '/_' '--' | cut -c1-28 | sed 's/-$//')
            echo "== preview $b"; curl -sS -m 40 -w '\nHTTP %{http_code}\n' "https://$b.fire-mate-627.pages.dev/api/news?s=SCHD,360750&probe=$GITHUB_SHA" | cut -c1-1500
          fi
      - name: Verify app integrity and version consistency
        run: python3 scripts/check_app.py
      - name: Test asset and FIRE calculations
        run: node scripts/test_calculations.cjs
      - name: Test storage rollback guards
        run: node tests/storage-rollback.test.cjs
      - name: Test PWA update guards
        run: node tests/pwa-update.test.cjs
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          assert scripts, 'No inline scripts found'
          for i,code in enumerate(scripts,1):
              with tempfile.NamedTemporaryFile(suffix='.js',mode='w',encoding='utf-8') as f:
                  f.write(code);f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
              print('PASS: script',i)
          for js in sorted(Path('js').glob('*.js')):
              subprocess.run(['node','--check',str(js)],check=True)
              print('PASS:',js)
          PY
