name: PWA update regression checks
on:
  pull_request:
  push:
    branches:
      - stability/pwa-update-tests
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PWA static regression checks
        run: node tests/pwa-update.test.cjs
